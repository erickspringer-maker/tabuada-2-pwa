<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="application-name" content="Tabuada 2">
<title>Tabuada</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app"></div>
<script>
(async()=>{const parts=['./app-01.part','./app-02.part','./app-03.part','./app-04.part','./app-05.part','./app-06.part'];try{const code=(await Promise.all(parts.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.text()})))).join('');(0,eval)(code)}catch(err){document.getElementById('app').innerHTML='<main style="padding:2rem;font-family:Arial">Não foi possível carregar o aplicativo. Atualize esta página enquanto estiver conectado à internet.</main>';console.error(err)}})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
</script>
</body>
</html>
